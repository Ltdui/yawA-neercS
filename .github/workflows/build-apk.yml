name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          
          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java Version String: $JAVA_VER_STR"
          
          JAVA_MAJOR=$(echo "$JAVA_VER_STR" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          
          if [ -z "$JAVA_MAJOR" ] || ! [ "$JAVA_MAJOR" -ge 0 ] 2>/dev/null; then
            echo "ERROR: Could not accurately detect Java major version."
            exit 1
          fi
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          
          echo "Java 17+ environment successfully confirmed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking / Generating Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK existence and integrity
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== Verifying APK at: $EXPECTED_APK ==="
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK."
            echo "Listing files found inside app/build/outputs/apk if available:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Built APK file is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension."; exit 1 ;;
          esac
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null || echo "0")
          echo "APK successfully verified. Size: $APK_SIZE bytes."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi
          
          RELEASE_ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"
          
          cp "$EXPECTED_APK" "$TARGET_ASSET_PATH"
          
          if [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty."
            exit 1
          fi
          
          echo "Prepared release asset: $TARGET_ASSET_PATH"
          echo "asset_path=$TARGET_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at $ASSET_PATH."
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset does not have .apk extension."; exit 1 ;;
          esac
          
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Away Time – Debug APK Build #${GITHUB_RUN_NUMBER}
          
          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Workflow Run Number**: ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA**: ${GITHUB_SHA}
          - **Asset File**: \`${ASSET_NAME}\`
          
          > ⚠️ **Notice**: This APK is intended for testing purposes and is signed with a temporary debug keystore. It is not a production Google Play Store release.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Workflow Execution Summary ==="
          
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release created successfully!"
            gh release view "$TAG_NAME" || true
            
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded!
          
          - **Direct Release URL**: [$RELEASE_TITLE]($RELEASE_URL)
          - **Release Tag**: \`$TAG_NAME\`
          - **Downloadable APK Asset**: \`$ASSET_NAME\`
          - **Workflow Artifact Backup**: \`app-debug-apk\`
          
          You can download the \`.apk\` file directly from the release **Assets** section onto your Android device for installation and testing. The standard GitHub Actions artifact is also preserved.
          EOF
          else
            echo "WARNING: GitHub Release creation did not succeed or was skipped."
            echo "The debug APK build and GitHub Actions artifact upload succeeded."
            echo "Artifact 'app-debug-apk' is available under the workflow run summary."
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Built (Release Publishing Warning)
          
          - **APK Build Status**: Succeeded
          - **Workflow Artifact**: \`app-debug-apk\` is available for download in this Actions run.
          - **Release Status**: Publishing to GitHub Releases could not complete (or permissions were not granted).
          
          You can download the APK directly from the **Artifacts** section of this workflow run.
          EOF
          fi
